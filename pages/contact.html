<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact Aroma Café in Chihuahua, Mexico. Get in touch with us for inquiries and reservations.">
  <title>Contact | Aroma Café</title>
  <link rel="stylesheet" href="../css/contact.css">
</head>
<body>
  <main>
    <h1>Aroma Café</h1>
    <h2>Contact Us</h2>

    <section class="contact-info">
      <div class="info-item">
        <strong>Location:</strong> Chihuahua, Chihuahua, Mexico
      </div>
      <div class="info-item">
        <strong>Hours:</strong> Monday–Saturday, 8:00 AM–8:00 PM
      </div>
      <div class="info-item">
        <strong>Phone:</strong> (614) 555-0199
      </div>
    </section>

    <form>
      <label for="name">Full Name</label>
      <input id="name" name="name" type="text" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>

      <button type="submit">Send Message</button>
    </form>

    <p class="demo-notice">Demo form only — messages are not sent.</p>
    <p><a href="../index.html">Back to home</a></p>
  </main>
</body>
</html>
